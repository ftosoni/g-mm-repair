name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # Run on x86-64 and arm64. The arm64 leg guards against architecture-specific
    # build breakage in the real makefiles -- e.g. the x86-only `-m64` flag in
    # brepair/makefile, which compiles on x86 but errors on aarch64 (the GB10 node).
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.SUBMODULE_PAT || github.token }}
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libomp-dev

    # Build brepair through its OWN makefile (not the hand-rolled gcc call in the
    # integration test), so this exercises brepair/makefile's flags on the target
    # architecture. This is the step that catches arch-specific flags like `-m64`.
    - name: Build brepair via its makefile
      run: make -C mm-repair/brepair

    # Run CPU-only integration tests for the RePair grammar pipeline
    - name: Run Integration Tests
      run: |
        python3 tests/run_integration_tests.py
